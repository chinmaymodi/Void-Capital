name: voidcapital

services:
  postgres:
    image: postgres:16-alpine
    container_name: voidcapital-postgres
    environment:
      POSTGRES_USER: vc_user
      POSTGRES_PASSWORD: vc_pass
      POSTGRES_DB: void_capital
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vc_user -d void_capital"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: voidcapital-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
